<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairo — Entrar</title>
  <meta name="description" content="O centro de comando para líderes que executam. Entra na Kairo." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07111f;
      --text: #f4f7fb;
      --muted: #95a5bf;
      --primary: #7c5cff;
      --primary-2: #00c2ff;
      --danger: #ff6b8a;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }
    html { font-size: 16px; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background:
        radial-gradient(circle at top left, rgba(124, 92, 255, 0.28), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 194, 255, 0.18), transparent 32%),
        linear-gradient(160deg, #050d18 0%, #07111f 48%, #0a1424 100%);
      color: var(--text);
    }

    .login-screen {
      width: 100%;
      max-width: 420px;
      background: rgba(13, 23, 40, 0.9);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(124, 92, 255, 0.22);
      border-radius: var(--radius-xl);
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(124, 92, 255, 0.08);
      padding: 52px 44px 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .login-logo {
      height: 72px;
      width: auto;
      object-fit: contain;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(124, 92, 255, 0.42);
      margin-bottom: 20px;
    }

    .login-title {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: 0.18em;
      background: linear-gradient(135deg, #fff 30%, rgba(124, 92, 255, 0.85));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      margin: 0 0 36px;
      color: var(--muted);
      font-size: 0.97rem;
      line-height: 1.5;
    }

    .google-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      color: #1f1f1f;
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-size: 0.96rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      width: 100%;
      justify-content: center;
      margin-bottom: 20px;
      font-family: inherit;
    }
    .google-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3); }
    .google-btn:active { transform: translateY(0); }
    .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .login-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .login-divider::before, .login-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }

    .login-email-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-input {
      width: 100%;
      border-radius: 14px;
      padding: 13px 16px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(154, 170, 196, 0.18);
      color: white;
      font: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.22s ease;
    }
    .login-input::placeholder { color: var(--muted); }
    .login-input:focus { border-color: rgba(124, 92, 255, 0.5); }

    .email-login-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #5d89ff);
      color: white;
      font-size: 0.96rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(124, 92, 255, 0.28);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      font-family: inherit;
    }
    .email-login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(124, 92, 255, 0.4); }
    .email-login-btn:active { transform: translateY(0); }

    .login-error-msg {
      color: var(--danger);
      font-size: 0.84rem;
      text-align: center;
      min-height: 18px;
      margin-top: -4px;
    }

    .login-toggle-link {
      display: block;
      margin-top: 6px;
      text-align: center;
      font-size: 0.83rem;
      color: var(--muted);
    }
    .login-toggle-link a {
      color: var(--primary-2);
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }
    .login-toggle-link a:hover { text-decoration: underline; }

    .login-field-hidden { display: none; }

    .login-footer {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 28px;
    }

    .lang-switch {
      margin-bottom: 20px;
    }
    .lang-switch a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 6px 14px;
      transition: 0.2s;
    }
    .lang-switch a:hover { border-color: var(--primary); color: var(--text); }

    @media (max-width: 480px) {
      .login-screen { padding: 36px 24px 32px; }
      .login-title { font-size: 1.6rem; }
    }
  </style>

  <!-- Google Analytics (GA4) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7QYXPE2G2J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-7QYXPE2G2J', { page_title: 'Login Kairo' });
  </script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <div class="login-screen">
    <img src="./logo-kairo.png" width="1254" height="1254" srcset="./logo-kairo.webp" alt="Kairo" loading="eager" class="login-logo" />
    <h1 class="login-title">KAIRO</h1>
    <p class="login-subtitle">Produtividade de Elite</p>

    <div class="lang-switch">
      <a href="login-en.html">🇬🇧 English</a>
    </div>

    <button id="google-signin-btn" class="google-btn" onclick="signInWithGoogle()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Entrar com Google
    </button>

    <div class="login-divider"><span>ou</span></div>

    <div class="login-email-form">
      <input type="text" id="login-name" placeholder="Nome" class="login-input login-field-hidden" autocomplete="name" />
      <input type="email" id="login-email" placeholder="Email" class="login-input" autocomplete="email" />
      <input type="password" id="login-password" placeholder="Password" class="login-input" autocomplete="current-password" />
      <input type="password" id="login-confirm-password" placeholder="Confirmar Password" class="login-input login-field-hidden" autocomplete="new-password" />
      <p id="login-error-msg" class="login-error-msg"></p>
      <button id="email-signin-btn" class="email-login-btn" onclick="signInWithEmail()">Entrar com Email</button>
      <p class="login-toggle-link" id="login-toggle-text">
        Não tens conta? <a id="login-toggle-link" onclick="toggleLoginMode()">Criar conta</a>
      </p>
    </div>

    <p class="login-footer">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Os teus dados ficam guardados de forma segura
    </p>
  </div>

  <script>
    (function() {
      const firebaseConfig = {
        apiKey: 'AIzaSyAjkpXMcKg7651b0DIRbeMk0QDmx7a5JGM',
        authDomain: 'kairoelite-a35a2.firebaseapp.com',
        projectId: 'kairoelite-a35a2',
        storageBucket: 'kairoelite-a35a2.appspot.com',
        messagingSenderId: '1013624006007',
        appId: '1:1013624006007:web:9a031dbffe9c8ef95e76aa',
      };
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();

      window.signInWithGoogle = async () => {
        try {
          await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        } catch (e) {
          showError('Erro ao entrar com Google. Tenta novamente.');
        }
      };

      window.signInWithEmail = async () => {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const isSignup = document.getElementById('login-toggle-link').dataset.mode === 'signup';

        if (!email || !password) { showError('Preenche email e password.'); return; }

        try {
          if (isSignup) {
            await auth.createUserWithEmailAndPassword(email, password);
          } else {
            await auth.signInWithEmailAndPassword(email, password);
          }
        } catch (e) {
          showError(mapError(e.code) || e.message);
        }
      };

      window.toggleLoginMode = () => {
        const link = document.getElementById('login-toggle-link');
        const btn = document.getElementById('email-signin-btn');
        const text = document.getElementById('login-toggle-text');
        const nameField = document.getElementById('login-name');
        const confirmField = document.getElementById('login-confirm-password');
        const isSignup = link.dataset.mode === 'signup';

        if (isSignup) {
          link.dataset.mode = 'login';
          link.textContent = 'Criar conta';
          btn.textContent = 'Entrar com Email';
          text.innerHTML = 'Não tens conta? <a id="login-toggle-link" onclick="toggleLoginMode()">Criar conta</a>';
          nameField.classList.add('login-field-hidden');
          confirmField.classList.add('login-field-hidden');
        } else {
          link.dataset.mode = 'signup';
          link.textContent = 'Já tenho conta';
          btn.textContent = 'Criar conta';
          text.innerHTML = 'Já tens conta? <a id="login-toggle-link" onclick="toggleLoginMode()">Entrar</a>';
          nameField.classList.remove('login-field-hidden');
          confirmField.classList.remove('login-field-hidden');
        }
      };

      auth.onAuthStateChanged((user) => {
        if (user) window.location.href = './app.html';
      });

      function showError(msg) {
        const el = document.getElementById('login-error-msg');
        el.textContent = msg;
        setTimeout(() => el.textContent = '', 5000);
      }

      function mapError(code) {
        const msgs = {
          'auth/invalid-email': 'Email inválido.',
          'auth/user-disabled': 'Conta desativada.',
          'auth/user-not-found': 'Utilizador não encontrado.',
          'auth/wrong-password': 'Password incorreta.',
          'auth/email-already-in-use': 'Este email já tem conta.',
          'auth/weak-password': 'Password fraca (min. 6 caracteres).',
          'auth/invalid-credential': 'Credenciais inválidas.',
        };
        return msgs[code];
      }
    })();
  </script>
</body>
</html>
