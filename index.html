<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairo</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#7c5cff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kairo" />
  <link rel="apple-touch-icon" href="./logo-kairo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #07111f;
      --bg-soft: #0d1728;
      --panel: rgba(13, 23, 40, 0.86);
      --panel-strong: #101c31;
      --panel-elevated: rgba(18, 31, 53, 0.94);
      --border: rgba(154, 170, 196, 0.14);
      --text: #f4f7fb;
      --muted: #95a5bf;
      --muted-strong: #b8c4d8;
      --primary: #7c5cff;
      --primary-2: #00c2ff;
      --success: #31d0aa;
      --warning: #ffb84d;
      --danger: #ff6b8a;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Inter", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124, 92, 255, 0.22), transparent 30%),
        radial-gradient(circle at top right, rgba(0, 194, 255, 0.16), transparent 28%),
        linear-gradient(160deg, #050d18 0%, #07111f 48%, #0a1424 100%);
      color: var(--text);
    }

    body {
      padding: 16px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      min-height: calc(100vh - 32px);
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 1600px;
      margin: 0 auto;
      position: relative;
    }

    .sidebar {
      display: none;
    }

    .main {
      width: 100%;
      min-width: 0;
      padding-bottom: 96px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      display: grid;
      place-items: center;
      box-shadow: 0 12px 28px rgba(124, 92, 255, 0.36);
    }

    .brand h1,
    .sidebar-brand h1 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
    }

    .brand p,
    .sidebar-brand p,
    .section-heading p,
    .hero-copy p,
    .subtle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .topbar-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted-strong);
      font-size: 0.85rem;
    }

    .view {
      display: none;
      animation: fadeIn 0.35s ease;
    }

    .view.active {
      display: block;
    }

    .hero-card,
    .panel,
    .metric-card,
    .timeline-block,
    .task-row,
    .habit-card,
    .event-card,
    .planner-card,
    .ai-card,
    .suggestion-card {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .hero-card {
      border-radius: var(--radius-xl);
      padding: 22px;
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
      background:
        linear-gradient(135deg, rgba(124, 92, 255, 0.18), rgba(0, 194, 255, 0.08)),
        var(--panel);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: auto -80px -80px auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 194, 255, 0.18), transparent 65%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hero-copy h2 {
      margin: 0 0 8px;
      font-size: 1.65rem;
      line-height: 1.15;
    }

    .hero-copy strong {
      color: white;
    }

    .hero-grid,
    .dashboard-grid,
    .planning-grid,
    .agenda-grid {
      display: grid;
      gap: 16px;
    }

    .hero-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .metric-card {
      padding: 16px;
      border-radius: var(--radius-lg);
      min-height: 118px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .metric-card:hover,
    .panel:hover,
    .timeline-block:hover,
    .task-row:hover,
    .habit-card:hover,
    .event-card:hover,
    .planner-card:hover,
    .suggestion-card:hover {
      transform: translateY(-2px);
      border-color: rgba(124, 92, 255, 0.32);
    }

    .metric-card small,
    .label {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .metric-card strong {
      font-size: 1.6rem;
      margin-top: 8px;
    }

    .dashboard-grid,
    .planning-grid,
    .agenda-grid {
      grid-template-columns: 1fr;
    }

    .panel {
      border-radius: var(--radius-xl);
      padding: 20px;
      min-width: 0;
    }

    .panel-header,
    .section-heading,
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .section-heading h3,
    .panel-header h3 {
      margin: 0;
      font-size: 1.05rem;
    }

    .next-event-card {
      border-radius: var(--radius-lg);
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(49, 208, 170, 0.16), rgba(124, 92, 255, 0.1)),
        rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(49, 208, 170, 0.25);
      margin-bottom: 14px;
    }

    .event-time,
    .badge,
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge {
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted-strong);
    }

    .badge.high,
    .priority-alta {
      background: rgba(255, 107, 138, 0.14);
      color: #ff9ab0;
    }

    .badge.medium,
    .priority-media {
      background: rgba(255, 184, 77, 0.14);
      color: #ffca7c;
    }

    .badge.low,
    .priority-baixa {
      background: rgba(49, 208, 170, 0.14);
      color: #82efd0;
    }

    .status-pendente {
      background: rgba(255, 184, 77, 0.12);
      color: #ffd48f;
    }

    .status-andamento {
      background: rgba(0, 194, 255, 0.12);
      color: #75ddff;
    }

    .status-concluida {
      background: rgba(49, 208, 170, 0.12);
      color: #7ff0cf;
    }

    .list-stack {
      display: grid;
      gap: 12px;
    }

    .mini-item,
    .task-row,
    .habit-card,
    .event-card,
    .planner-card,
    .suggestion-card {
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .mini-item {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .mini-item h4,
    .task-row h4,
    .habit-card h4,
    .event-card h4,
    .planner-card h4,
    .suggestion-card h4 {
      margin: 0 0 6px;
      font-size: 0.98rem;
    }

    .mini-item p,
    .task-row p,
    .habit-card p,
    .event-card p,
    .planner-card p,
    .suggestion-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
      font-size: 0.9rem;
    }

    .ai-card {
      padding: 18px;
      border-radius: var(--radius-lg);
      background:
        linear-gradient(135deg, rgba(124, 92, 255, 0.22), rgba(0, 194, 255, 0.08)),
        rgba(255, 255, 255, 0.04);
    }

    .ai-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ai-mark {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
    }

    .progress-ring {
      width: 126px;
      height: 126px;
      border-radius: 50%;
      background: conic-gradient(var(--success) calc(var(--value) * 1%), rgba(255, 255, 255, 0.08) 0);
      display: grid;
      place-items: center;
      margin: 4px auto 16px;
      position: relative;
    }

    .progress-ring::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      background: #0b1628;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-ring strong {
      position: relative;
      z-index: 1;
      font-size: 1.45rem;
    }

    .filters,
    .tab-switch,
    .chips {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip,
    .switch-btn,
    .nav-btn,
    .ghost-btn,
    .primary-btn,
    .habit-action {
      border-radius: 14px;
      transition: all 0.24s ease;
    }

    .chip,
    .switch-btn,
    .ghost-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted-strong);
      padding: 10px 14px;
    }

    .chip.active,
    .switch-btn.active,
    .ghost-btn:hover {
      border-color: rgba(124, 92, 255, 0.4);
      background: rgba(124, 92, 255, 0.14);
      color: #fff;
    }

    .primary-btn,
    .habit-action {
      background: linear-gradient(135deg, var(--primary), #5d89ff);
      color: white;
      padding: 11px 16px;
      box-shadow: 0 14px 30px rgba(124, 92, 255, 0.28);
    }

    .primary-btn:hover,
    .habit-action:hover {
      transform: translateY(-1px) scale(1.01);
    }

    .task-input-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .task-input,
    .task-select {
      width: 100%;
      border-radius: 16px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border);
      color: white;
      outline: none;
    }

    input[type="date"].task-input,
    input[type="time"].task-input,
    input[type="date"].task-input::-webkit-calendar-picker-indicator,
    input[type="time"].task-input::-webkit-calendar-picker-indicator {
      color-scheme: dark;
    }

    .task-select option {
      background: #0f1a2d;
    }

    .task-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: flex-start;
      position: relative;
      overflow: hidden;
    }

    .task-row.done {
      opacity: 0.72;
    }

    .task-row.done h4 {
      text-decoration: line-through;
    }

    .task-row.overdue {
      border-color: rgba(255, 107, 138, 0.32);
      background:
        linear-gradient(135deg, rgba(255, 107, 138, 0.12), transparent 40%),
        var(--panel);
    }

    .checkbox-btn {
      margin-top: 2px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.03);
      display: grid;
      place-items: center;
      color: transparent;
      flex-shrink: 0;
    }

    .checkbox-btn.checked {
      color: white;
      background: linear-gradient(135deg, var(--success), #4fe3bc);
      border-color: transparent;
      animation: pop 0.3s ease;
    }

    .task-top,
    .habit-top,
    .event-top,
    .planner-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .task-meta,
    .habit-meta,
    .event-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .habit-card.done {
      border-color: rgba(49, 208, 170, 0.3);
      background:
        linear-gradient(135deg, rgba(49, 208, 170, 0.15), transparent 45%),
        var(--panel);
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
      margin: 14px 0 12px;
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
    }

    .agenda-grid .panel,
    .planning-grid .panel {
      height: 100%;
    }

    .event-card {
      display: grid;
      gap: 10px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.015)),
        rgba(255, 255, 255, 0.02);
    }

    .timeline-stack {
      display: grid;
      gap: 12px;
      position: relative;
    }

    .timeline-block,
    .planner-card {
      position: relative;
    }

    .timeline-block::before,
    .planner-card::before {
      content: "";
      position: absolute;
      left: 18px;
      top: 20px;
      bottom: 20px;
      width: 3px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--primary), transparent);
      opacity: 0.55;
    }

    .timeline-inner,
    .planner-inner {
      padding-left: 24px;
    }

    .suggestion-list {
      display: grid;
      gap: 12px;
    }

    .bottom-nav {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 14px;
      z-index: 30;
      background: rgba(9, 16, 28, 0.9);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
      border-radius: 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      padding: 8px;
      gap: 6px;
    }

    .nav-btn {
      min-height: 58px;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.72rem;
    }

    .nav-btn.active {
      color: white;
      background: rgba(124, 92, 255, 0.14);
    }

    .toast-wrap {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 50;
      display: grid;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      min-width: 240px;
      max-width: 320px;
      background: rgba(11, 20, 36, 0.96);
      color: white;
      border: 1px solid rgba(124, 92, 255, 0.22);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      animation: slideIn 0.35s ease;
    }

    .empty-state {
      border-radius: var(--radius-lg);
      padding: 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.025);
    }

    /* Task action buttons */
    .task-actions {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .task-action-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      display: grid;
      place-items: center;
      transition: all 0.22s ease;
      flex-shrink: 0;
    }

    .task-action-btn:hover {
      border-color: rgba(124, 92, 255, 0.4);
      background: rgba(124, 92, 255, 0.1);
      color: white;
    }

    .task-action-btn.danger:hover {
      border-color: rgba(255, 107, 138, 0.4);
      background: rgba(255, 107, 138, 0.1);
      color: var(--danger);
    }

    /* Voice button */
    .task-title-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .task-title-wrapper .task-input {
      width: 100%;
      padding-right: 48px;
    }

    .voice-btn {
      position: absolute;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      display: grid;
      place-items: center;
      transition: all 0.22s ease;
      flex-shrink: 0;
    }

    .voice-btn:hover {
      border-color: rgba(124, 92, 255, 0.4);
      background: rgba(124, 92, 255, 0.1);
      color: white;
    }

    .voice-btn.recording {
      background: rgba(255, 107, 138, 0.18);
      border-color: rgba(255, 107, 138, 0.55);
      color: var(--danger);
      animation: pulse-mic 1s ease-in-out infinite;
    }

    @keyframes pulse-mic {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 138, 0.45); }
      50% { box-shadow: 0 0 0 7px rgba(255, 107, 138, 0); }
    }

    /* Edit modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-box {
      width: 100%;
      max-width: 560px;
      background: #0d1728;
      border: 1px solid rgba(124, 92, 255, 0.28);
      border-radius: var(--radius-xl);
      box-shadow: 0 32px 72px rgba(0, 0, 0, 0.64), 0 0 0 1px rgba(124, 92, 255, 0.08);
      padding: 26px;
      animation: slideUp 0.26s ease;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.08rem;
    }

    .modal-close {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      display: grid;
      place-items: center;
      transition: all 0.22s ease;
    }

    .modal-close:hover {
      color: white;
      background: rgba(255, 255, 255, 0.1);
    }

    .modal-field {
      margin-bottom: 14px;
    }

    .modal-field label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .modal-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-textarea {
      width: 100%;
      border-radius: 16px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--border);
      color: white;
      outline: none;
      font: inherit;
      resize: vertical;
      min-height: 72px;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 22px;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 768px) {
      body {
        padding: 22px;
      }

      .task-input-row {
        grid-template-columns: 2fr 1fr 1fr 130px 90px auto;
      }

      .dashboard-grid {
        grid-template-columns: 1.1fr 0.9fr;
      }

      .agenda-grid,
      .planning-grid {
        grid-template-columns: 1.1fr 0.9fr;
      }
    }

    @media (min-width: 1100px) {
      body {
        padding: 24px;
      }

      .app-shell {
        grid-template-columns: 280px minmax(0, 1fr);
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        padding: 20px;
        background: rgba(8, 15, 28, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 30px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        position: sticky;
        top: 24px;
        height: calc(100vh - 48px);
      }

      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 28px;
      }

      .sidebar-nav {
        display: grid;
        gap: 10px;
      }

      .sidebar .nav-btn {

      const taskScore = (getCompletedTasks().length / totalTasks) * 65;
      const habitScore = (getCompletedHabitsToday().length / totalHabits) * 35;
      return Math.min(100, Math.round(taskScore + habitScore));
    }

    function getImportantTodayCount() {
      return getTodayTasks().filter(task => task.prioridade === "alta" && task.status !== "concluida").length;
    }

    function getBusyDayInsight() {
      const eventCount = getTodayEvents().length;
      const taskCount = getTodayTasks().filter(task => task.status !== "concluida").length;
      if (eventCount >= 4 && taskCount >= 3) {
        return "Sua agenda está intensa após o almoço. Proteja um bloco de foco entre 10h e 11h30.";
      }
      if (getOverdueTasks().length) {
        return "Há tarefas atrasadas no radar. Feche as pendências críticas antes de iniciar novas demandas.";
      }
      return "Seu dia está equilibrado. Mantenha os blocos de foco e preserve a rotina de hábitos.";
    }

    function generateKairoInsights() {
      const events = getTodayEvents().length;
      const tasks = getTodayTasks().filter(task => task.status !== "concluida").length;
      const habits = getPendingHabits().length;
      const overdue = getOverdueTasks().length;
      const highPriorityTask = appState.tarefas
        .filter(task => task.status !== "concluida")
        .sort((a, b) => {
          const priorityWeight = { alta: 3, media: 2, baixa: 1 };
          return priorityWeight[b.prioridade] - priorityWeight[a.prioridade] || new Date(a.prazo) - new Date(b.prazo);
        })[0];

      const insights = [];
      insights.push({
        id: "dynamic-summary",
        tipo: "resumo",
        mensagem: `Bom dia! Você tem ${events} compromissos, ${tasks} tarefas e ${habits} hábitos hoje.`,
        acaoRecomendada: highPriorityTask ? `Priorize "${highPriorityTask.titulo}" no próximo bloco disponível.` : "Seu ritmo está sob controle hoje."
      });

      if (overdue) {
        insights.push({
          id: "dynamic-overdue",
          tipo: "alerta",
          mensagem: `Você tem ${overdue} tarefa${overdue > 1 ? "s" : ""} atrasada${overdue > 1 ? "s" : ""}.`,
          acaoRecomendada: "Realoque itens de baixa prioridade e feche as pendências mais antigas antes das 11h."
        });
      }

      if (events >= 4) {
        insights.push({
          id: "dynamic-load",
          tipo: "carga",
          mensagem: "Seu dia está denso com reuniões e blocos de execução.",
          acaoRecomendada: "Mantenha uma pausa curta entre 15h e 16h para preservar energia cognitiva."
        });
      }

      if (getPendingHabits().length >= 2) {
        insights.push({
          id: "dynamic-habit",
          tipo: "habito",
          mensagem: "Você pode fortalecer sua consistência hoje com um hábito rápido.",
          acaoRecomendada: "Marque leitura ou alongamento logo após seu próximo compromisso."
        });
      }

      return insights;
    }

      return `<span class="badge">${category}</span>`;

    function formatPriority(priority) {
      return priority.charAt(0).toUpperCase() + priority.slice(1);
    }

    function formatStatus(status) {
      if (status === "andamento") return "Em andamento";
      return status.charAt(0).toUpperCase() + status.slice(1);
    }

    function renderHistorico() {
      const view = document.getElementById("historico-view");
      const dateInicio = appState.historicoDateInicio;
      const dateFim = appState.historicoDateFim;
      const categFilter = appState.historicoCategFilter;

      const filtered = appState.tarefas.filter(task => {
        const taskDate = task.prazo.slice(0, 10);
        const afterStart = !dateInicio || taskDate >= dateInicio;
        const beforeEnd = !dateFim || taskDate <= dateFim;
        const categMatches = categFilter === "todas" || task.categoria === categFilter;
        const statusMatches = statusFilter === "todas" || task.status === statusFilter;
        return afterStart && beforeEnd && categMatches && statusMatches;
      }).sort((a, b) => new Date(b.prazo) - new Date(a.prazo));

      view.innerHTML = `
        <div class="panel">
          <div class="panel-header">
            <div>
              <h3>Histórico</h3>
              <p>Registo completo de todas as tarefas</p>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
              <span class="pill"><i data-lucide="list-checks"></i>${appState.tarefas.filter(t => t.status === "concluida").length} concluídas</span>
              <button class="ghost-btn" id="export-word-hist-btn" style="display:inline-flex;align-items:center;gap:8px;padding:10px 14px;">

            </div>
            <div style="display:flex;flex-direction:column;gap:5px;">
              <label style="font-size:0.78rem;color:var(--muted);font-weight:500;letter-spacing:0.02em;">Data fim</label>
              <input type="date" class="task-input" id="hist-date-fim" value="${dateFim}" style="max-width:165px;" />
            </div>
            ${(dateInicio || dateFim) ? `<button class="ghost-btn" id="hist-clear-dates" style="padding:10px 14px;align-self:flex-end;" title="Limpar datas"><i data-lucide="x-circle"></i></button>` : ""}
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;">
            ${categories.map(cat => `<button class="chip ${categFilter === cat ? "active" : ""}" data-hist-categ="${cat}">${cat === "todas" ? "Todas categorias" : cat}</button>`).join("")}

          <div class="filters" style="margin-bottom:16px;">
            <button class="chip ${statusFilter === "todas" ? "active" : ""}" data-hist-status="todas">Todos status</button>
            <button class="chip ${statusFilter === "concluida" ? "active" : ""}" data-hist-status="concluida">Concluídas</button>
            <button class="chip ${statusFilter === "pendente" ? "active" : ""}" data-hist-status="pendente">Pendentes</button>
            <button class="chip ${statusFilter === "andamento" ? "active" : ""}" data-hist-status="andamento">Em andamento</button>

    function exportToWord(tasks) {
      const now = new Date();
      const dateStr = now.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });

      const concluded = tasks.filter(t => t.status === "concluida");
      const inProgress = tasks.filter(t => t.status === "andamento");
      const pending = tasks.filter(t => t.status === "pendente");

      function priorityColor(p) {
        if (p === "alta") return "#c0392b";
        if (p === "media") return "#e67e22";
        return "#27ae60";
      }
      function priorityBg(p) {
        if (p === "alta") return "#fde8ec";
        if (p === "media") return "#fef3e2";
        return "#e9f9ef";
      }

      function taskTable(list) {
        if (!list.length) return `<p style="color:#888;font-style:italic;margin:6px 0 18px;">Nenhuma tarefa nesta secção.</p>`;
        return `
          <table style="width:100%;border-collapse:collapse;margin-bottom:24px;font-size:13px;">
            <thead>
              <tr style="background:#1a1a2e;color:#ffffff;">
                <th style="padding:10px 12px;text-align:left;border:1px solid #d0d0dc;">Título</th>
                <th style="padding:10px 12px;text-align:left;border:1px solid #d0d0dc;white-space:nowrap;">Prioridade</th>
                <th style="padding:10px 12px;text-align:left;border:1px solid #d0d0dc;">Categoria</th>
                <th style="padding:10px 12px;text-align:left;border:1px solid #d0d0dc;white-space:nowrap;">Prazo</th>
              </tr>
            </thead>
            <tbody>
              ${list.map((t, i) => `
                <tr style="background:${i % 2 === 0 ? "#f5f5fa" : "#ffffff"};">
                  <td style="padding:9px 12px;border:1px solid #d0d0dc;">
                    <strong style="color:#1a1a2e;">${t.titulo}</strong><br/>
                    <span style="font-size:11px;color:#666;">${t.descricao}</span>
                  </td>
                  <td style="padding:9px 12px;border:1px solid #d0d0dc;">
                    <span style="background:${priorityBg(t.prioridade)};color:${priorityColor(t.prioridade)};padding:3px 8px;border-radius:4px;font-size:12px;font-weight:600;">${formatPriority(t.prioridade)}</span>
                  </td>
                  <td style="padding:9px 12px;border:1px solid #d0d0dc;color:#444;">${t.categoria}</td>
                  <td style="padding:9px 12px;border:1px solid #d0d0dc;color:#444;white-space:nowrap;">${new Date(t.prazo).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" })}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>`;
      }

      const html = `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family:Calibri,Arial,sans-serif;margin:48px;color:#1a1a2e;line-height:1.5;">
  <div style="border-bottom:3px solid #7c5cff;padding-bottom:14px;margin-bottom:8px;">
    <h1 style="margin:0;font-size:26px;color:#1a1a2e;letter-spacing:-0.5px;">Kairo &mdash; Relat&oacute;rio de Tarefas</h1>
  </div>
  <p style="color:#666;font-size:13px;margin:6px 0 32px;">Data do relat&oacute;rio: ${dateStr} &nbsp;&middot;&nbsp; Total de tarefas: ${tasks.length}</p>

  <h2 style="font-size:14px;color:#7c5cff;text-transform:uppercase;letter-spacing:1px;margin:28px 0 10px;border-left:4px solid #31d0aa;padding-left:10px;">Conclu&#237;das (${concluded.length})</h2>
  ${taskTable(concluded)}

  <h2 style="font-size:14px;color:#7c5cff;text-transform:uppercase;letter-spacing:1px;margin:28px 0 10px;border-left:4px solid #00c2ff;padding-left:10px;">Em Andamento (${inProgress.length})</h2>
  ${taskTable(inProgress)}

  <h2 style="font-size:14px;color:#7c5cff;text-transform:uppercase;letter-spacing:1px;margin:28px 0 10px;border-left:4px solid #ffb84d;padding-left:10px;">Pendentes (${pending.length})</h2>
  ${taskTable(pending)}

  <div style="margin-top:40px;padding-top:12px;border-top:1px solid #ddd;color:#999;font-size:12px;text-align:center;">
    Gerado por Kairo &nbsp;&middot;&nbsp; ${dateStr}
  </div>
</body>
</html>`;

      const blob = new Blob(["\ufeff" + html], { type: "application/msword" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `kairo-tarefas-${new Date().toISOString().slice(0, 10)}.doc`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast("Relatório exportado com sucesso.");
    }

    function renderAll() {
      document.getElementById("today-label").textContent = formatDateLong(appState.today);
      document.getElementById("topbar-focus").textContent = `${getImportantTodayCount()} prioridades críticas`;
      const dynamicInsights = generateKairoInsights();
      document.getElementById("sidebar-ai-copy").textContent = dynamicInsights[0].acaoRecomendada;

      renderNav();
      renderDashboard();
      renderAgenda();
      renderTarefas();
      renderHabitos();
      renderHistorico();

      Object.entries(viewIds).forEach(([key, id]) => {
        document.getElementById(id).classList.toggle("active", key === appState.currentView);
      });

      bindEvents();
      lucide.createIcons();
    }

    function switchView(view) {
      appState.currentView = view;
      renderAll();
    }

    function addQuickTask() {
      const titleInput = document.getElementById("quick-task-title");
      const priorityInput = document.getElementById("quick-task-priority");
      const categoryInput = document.getElementById("quick-task-category");
      const dateInput = document.getElementById("quick-task-date");
      const timeInput = document.getElementById("quick-task-time");
      if (!titleInput) return;
      const title = titleInput.value.trim();
      if (!title) {
        showToast("Digite um título para criar a tarefa.");
        return;
      }

      const taskDate = dateInput && dateInput.value ? dateInput.value : appState.today;
      const taskTime = timeInput && timeInput.value ? timeInput.value : "18:00";

      const id = (appState.tarefas.length ? Math.max(...appState.tarefas.map(task => task.id)) : 0) + 1;
      appState.tarefas.unshift({
        id,
        titulo: title,
        descricao: "Tarefa criada rapidamente para manter o fluxo de execução.",
        prioridade: priorityInput.value,
        status: "pendente",
        prazo: `${taskDate}T${taskTime}`,
        categoria: categoryInput.value
      });

      renderAll();
      switchView("tarefas");
      showToast(`Tarefa "${title}" criada com sucesso.`);
    }

    function addQuickHabit() {
      const nameInput = document.getElementById("quick-habit-name");
      const freqInput = document.getElementById("quick-habit-freq");
      if (!nameInput) return;
      const name = nameInput.value.trim();
      if (!name) {
        showToast("Digite um nome para o hábito.");
        return;
      }
      const id = appState.habitos.length ? Math.max(...appState.habitos.map(h => h.id)) + 1 : 1;
      appState.habitos.push({
        id,
        nome: name,
        frequencia: freqInput.value,
        progresso: 0,
        streak: 0,
        concluidoHoje: false
      });
      renderAll();
      showToast(`Hábito "${name}" criado com sucesso.`);
    }

    function deleteHabit(habitId) {
      const habit = appState.habitos.find(item => item.id === Number(habitId));
      if (!habit) return;
      if (!confirm(`Apagar "${habit.nome}"? Esta ação não pode ser desfeita.`)) return;
      appState.habitos = appState.habitos.filter(item => item.id !== Number(habitId));
      renderAll();
      showToast(`Hábito "${habit.nome}" apagado.`);
    }

    function deleteEvent(eventId) {
      const event = appState.eventos.find(e => e.id === Number(eventId));
      if (!event) return;
      if (!confirm(`Apagar "${event.titulo}"? Esta ação não pode ser desfeita.`)) return;
      appState.eventos = appState.eventos.filter(e => e.id !== Number(eventId));
      renderAll();
      showToast(`Evento "${event.titulo}" apagado.`);
    }

    function completeTask(taskId) {
      const task = appState.tarefas.find(item => item.id === Number(taskId));
      if (!task || task.status === "concluida") return;
      task.status = "concluida";
      renderAll();
      showToast(`Excelente! "${task.titulo}" foi concluída.`);
    }

    function deleteTask(taskId) {
      const task = appState.tarefas.find(item => item.id === Number(taskId));
      if (!task) return;
      if (!confirm(`Apagar "${task.titulo}"? Esta ação não pode ser desfeita.`)) return;
      appState.tarefas = appState.tarefas.filter(item => item.id !== Number(taskId));
      renderAll();
      showToast(`Tarefa "${task.titulo}" apagada.`);
    }

    function openEditModal(taskId) {
      const task = appState.tarefas.find(item => item.id === Number(taskId));
      if (!task) return;

      const prazoDate = task.prazo.split("T")[0] || appState.today;
      const prazoTime = task.prazo.split("T")[1] ? task.prazo.split("T")[1].slice(0, 5) : "18:00";

      document.getElementById("edit-task-id").value = task.id;
      document.getElementById("edit-task-title").value = task.titulo;
      document.getElementById("edit-task-desc").value = task.descricao;
      document.getElementById("edit-task-priority").value = task.prioridade;
      document.getElementById("edit-task-category").value = task.categoria;
      document.getElementById("edit-task-date").value = prazoDate;
      document.getElementById("edit-task-time").value = prazoTime;

      document.getElementById("edit-modal").classList.remove("hidden");
    }

    function closeEditModal() {
      document.getElementById("edit-modal").classList.add("hidden");
    }

    function saveEditTask() {
      const id = Number(document.getElementById("edit-task-id").value);
      const task = appState.tarefas.find(item => item.id === id);
      if (!task) return;

      const title = document.getElementById("edit-task-title").value.trim();
      if (!title) {
        showToast("O título não pode estar vazio.");
        return;
      }

      task.titulo = title;
      task.descricao = document.getElementById("edit-task-desc").value.trim();
      task.prioridade = document.getElementById("edit-task-priority").value;
      task.categoria = document.getElementById("edit-task-category").value;
      const date = document.getElementById("edit-task-date").value || appState.today;
      const time = document.getElementById("edit-task-time").value || "18:00";
      task.prazo = `${date}T${time}`;

      closeEditModal();
      renderAll();
      showToast(`Tarefa "${task.titulo}" atualizada.`);
    }

    function completeHabit(habitId) {
      const habit = appState.habitos.find(item => item.id === Number(habitId));
      if (!habit || habit.concluidoHoje) return;
      habit.concluidoHoje = true;
      habit.streak += 1;
      habit.progresso = Math.min(100, habit.progresso + 12);
      renderAll();
      showToast(`Streak atualizado: ${habit.nome} agora está em ${habit.streak} dias.`);
    }

    // ---- Voice recognition ----
    let _voiceRecognizer = null;
    let _voiceListening = false;

    function bindVoiceBtn() {
      const btn = document.getElementById("voice-task-btn");
      if (!btn) return;

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        btn.style.display = "none";
        return;
      }

      btn.onclick = () => {
        if (_voiceListening) {
          if (_voiceRecognizer) _voiceRecognizer.stop();
          return;
        }

        _voiceRecognizer = new SR();
        _voiceRecognizer.lang = "pt-PT";
        _voiceRecognizer.interimResults = false;
        _voiceRecognizer.maxAlternatives = 1;
        _voiceRecognizer.continuous = false;

        _voiceRecognizer.onstart = () => {
          _voiceListening = true;
          btn.classList.add("recording");
          showToast("A ouvir...");
        };

        _voiceRecognizer.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          const titleInput = document.getElementById("quick-task-title");
          if (titleInput) {
            titleInput.value = transcript;
            titleInput.focus();
          }
        };

        _voiceRecognizer.onend = () => {
          _voiceListening = false;
          const b = document.getElementById("voice-task-btn");
          if (b) b.classList.remove("recording");
        };

        _voiceRecognizer.onerror = (e) => {
          _voiceListening = false;
          const b = document.getElementById("voice-task-btn");
          if (b) b.classList.remove("recording");
          if (e.error !== "no-speech" && e.error !== "aborted") {
            showToast("Não foi possível captar voz. Tente novamente.");
          }
        };

        _voiceRecognizer.start();
      };
    }
    // ---- End voice recognition ----

    function showToast(message) {
      const wrap = document.getElementById("toast-wrap");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      wrap.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(12px)";
      }, 2600);
      setTimeout(() => toast.remove(), 3200);
    }

    function bindEvents() {
      document.querySelectorAll("[data-view]").forEach(button => {
        button.onclick = () => switchView(button.dataset.view);
      });

      document.querySelectorAll("[data-agenda-mode]").forEach(button => {

          appState.agendaMode = button.dataset.agendaMode;
          renderAll();

      document.querySelectorAll("[data-task-filter]").forEach(button => {
        button.onclick = () => {

          renderAll();
        };
      });

      document.querySelectorAll("[data-priority-filter]").forEach(button => {
        button.onclick = () => {
          appState.priorityFilter = button.dataset.priorityFilter;
          renderAll();
        };
      });

      document.querySelectorAll("[data-complete-task]").forEach(button => {
        button.onclick = () => completeTask(button.dataset.completeTask);
      });

      document.querySelectorAll("[data-edit-task]").forEach(button => {
        button.onclick = () => openEditModal(button.dataset.editTask);
      });

      document.querySelectorAll("[data-delete-task]").forEach(button => {
        button.onclick = () => deleteTask(button.dataset.deleteTask);
      });

      document.querySelectorAll("[data-complete-habit]").forEach(button => {
        button.onclick = () => completeHabit(button.dataset.completeHabit);
      });

      document.querySelectorAll("[data-delete-habit]").forEach(button => {
        button.onclick = () => deleteHabit(button.dataset.deleteHabit);
      });

      document.querySelectorAll("[data-delete-event]").forEach(button => {
        button.onclick = () => deleteEvent(button.dataset.deleteEvent);
      });

      document.querySelectorAll("[data-hist-categ]").forEach(button => {
        button.onclick = () => {
          appState.historicoCategFilter = button.dataset.histCateg;
          renderAll();
        };
      });

      document.querySelectorAll("[data-hist-status]").forEach(button => {
        button.onclick = () => {
          appState.historicoStatusFilter = button.dataset.histStatus;
          renderAll();
        };
      });

      const histDateInicio = document.getElementById("hist-date-inicio");
      if (histDateInicio) {
        histDateInicio.onchange = () => {
          appState.historicoDateInicio = histDateInicio.value;
          renderAll();
        };
      }

      const histDateFim = document.getElementById("hist-date-fim");
      if (histDateFim) {
        histDateFim.onchange = () => {
          appState.historicoDateFim = histDateFim.value;
          renderAll();
        };
      }

      const histClearDates = document.getElementById("hist-clear-dates");
      if (histClearDates) {
        histClearDates.onclick = () => {
          appState.historicoDateInicio = "";
          appState.historicoDateFim = "";
          renderAll();
        };
      }

      const exportWordHistBtn = document.getElementById("export-word-hist-btn");
      if (exportWordHistBtn) {
        exportWordHistBtn.onclick = () => {
          const di = appState.historicoDateInicio;
          const df = appState.historicoDateFim;
          const cat = appState.historicoCategFilter;
          const st = appState.historicoStatusFilter;
          const toExport = appState.tarefas.filter(task => {
            const td = task.prazo.slice(0, 10);
            return (!di || td >= di) && (!df || td <= df) && (cat === "todas" || task.categoria === cat) && (st === "todas" || task.status === st);
          });
          exportToWord(toExport);
        };
      }

      const exportWordTasksBtn = document.getElementById("export-word-tasks-btn");
      if (exportWordTasksBtn) {
        exportWordTasksBtn.onclick = () => exportToWord(appState.tarefas);
      }

      const quickTaskSubmit = document.getElementById("quick-task-submit");
      if (quickTaskSubmit) {
        quickTaskSubmit.onclick = addQuickTask;
      }

      const quickTaskTitle = document.getElementById("quick-task-title");
      if (quickTaskTitle) {
        quickTaskTitle.onkeydown = (event) => {
          if (event.key === "Enter") addQuickTask();
        };
      }

      const quickHabitSubmit = document.getElementById("quick-habit-submit");
      if (quickHabitSubmit) {
        quickHabitSubmit.onclick = addQuickHabit;
      }

      const quickHabitName = document.getElementById("quick-habit-name");
      if (quickHabitName) {
        quickHabitName.onkeydown = (event) => {
          if (event.key === "Enter") addQuickHabit();
        };
      }

      bindVoiceBtn();

      // Set default date/time to now
      const dateInput = document.getElementById("quick-task-date");
      const timeInput = document.getElementById("quick-task-time");
      if (dateInput && !dateInput.value) {
        dateInput.value = appState.today;
      }
      if (timeInput && !timeInput.value) {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        timeInput.value = `${hh}:${mm}`;
      }
    }

    renderAll();

    // Modal buttons (bound once, outside renderAll cycle)
    document.getElementById("modal-close-btn").onclick = closeEditModal;
    document.getElementById("modal-cancel-btn").onclick = closeEditModal;
    document.getElementById("modal-save-btn").onclick = saveEditTask;
    document.getElementById("edit-modal").onclick = function(e) {
      if (e.target === this) closeEditModal();
    };

    // Register Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then((reg) => console.log("[SW] Registado:", reg.scope))
          .catch((err) => console.warn("[SW] Falha no registo:", err));
      });
    }

    // ---- Kairo AI Chat ----
    function _escapeHTML(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    const kairoChat = {
      isOpen: false,
      hasOpened: false,

      open() {
        document.getElementById("kairo-chat-panel").classList.add("open");
        this.isOpen = true;
        if (!this.hasOpened) {
          this.hasOpened = true;
          setTimeout(() => this._sendWelcome(), 650);
        }
        setTimeout(() => {
          const inp = document.getElementById("chat-input");
          if (inp) inp.focus();
        }, 320);
      },

      close() {
        document.getElementById("kairo-chat-panel").classList.remove("open");
        this.isOpen = false;
      },

      toggle() {
        if (this.isOpen) this.close(); else this.open();
      },

      _now() {
        const d = new Date();
        return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
      },

      _appendMsg(text, from) {
        const container = document.getElementById("chat-messages");
        if (!container) return;
        const ts = this._now();
        const wrap = document.createElement("div");
        wrap.className = "chat-msg " + from;
        if (from === "ai") {
          wrap.innerHTML = `<div class="chat-msg-avatar"><i data-lucide="bot"></i></div><div><div class="chat-bubble">${_escapeHTML(text)}</div><div class="chat-timestamp">${ts}</div></div>`;
        } else {
          wrap.innerHTML = `<div><div class="chat-bubble">${_escapeHTML(text)}</div><div class="chat-timestamp">${ts}</div></div>`;
        }
        container.appendChild(wrap);
        container.scrollTop = container.scrollHeight;
        lucide.createIcons();
      },

      _showTyping() {
        const container = document.getElementById("chat-messages");
        if (!container || document.getElementById("chat-typing-indicator")) return;
        const wrap = document.createElement("div");
        wrap.id = "chat-typing-indicator";
        wrap.className = "chat-typing-wrap";
        wrap.innerHTML = `<div class="chat-msg-avatar"><i data-lucide="bot"></i></div><div class="chat-typing"><span></span><span></span><span></span></div>`;
        container.appendChild(wrap);
        container.scrollTop = container.scrollHeight;
        lucide.createIcons();
      },

      _hideTyping() {
        const el = document.getElementById("chat-typing-indicator");
        if (el) el.remove();
      },

      _sendWelcome() {
        const pending = appState.tarefas.filter(t => t.status !== "concluida");
        const pendingH = getPendingHabits();
        const overdue = getOverdueTasks();
        const topTask = appState.tarefas
          .filter(t => t.status !== "concluida" && t.prioridade === "alta")
          .sort((a, b) => new Date(a.prazo) - new Date(b.prazo))[0];

        let msg = `Olá, ${appState.user.nome}! Tens ${pending.length} tarefa${pending.length !== 1 ? "s" : ""} pendente${pending.length !== 1 ? "s" : ""} e ${pendingH.length} hábito${pendingH.length !== 1 ? "s" : ""} por completar hoje.`;
        if (topTask) msg += ` Recomendo começar pela tarefa de alta prioridade: "${topTask.titulo}".`;
        if (overdue.length) msg += `\nAtenção: tens ${overdue.length} tarefa${overdue.length !== 1 ? "s" : ""} atrasada${overdue.length !== 1 ? "s" : ""}!`;

        this._showTyping();
        setTimeout(() => {
          this._hideTyping();
          this._appendMsg(msg, "ai");
        }, 700);
      },

      _getResponse(text) {
        const q = text.toLowerCase().trim();

        // saudações
        if (/\b(bom dia|boa tarde|boa noite|ol[aá]|oi)\b/.test(q)) {
          const h = new Date().getHours();
          const gr = h < 12 ? "Bom dia" : h < 19 ? "Boa tarde" : "Boa noite";
          const p = appState.tarefas.filter(t => t.status !== "concluida").length;
          const ev = getTodayEvents().length;
          return `${gr}, ${appState.user.nome}! Tens ${p} tarefa${p !== 1 ? "s" : ""} em aberto e ${ev} compromisso${ev !== 1 ? "s" : ""} hoje. Como posso ajudar-te?`;
        }

        // ajuda
        if (/\b(ajuda|help)\b/.test(q)) {
          return `Podes perguntar-me sobre:\n• Tarefas pendentes e prioridades\n• Estado dos teus hábitos e streaks\n• Compromissos e agenda do dia\n• Produtividade e progresso\n• Tarefas atrasadas\n• Sugestões e dicas personalizadas\n\nExemplos: "o que tenho hoje?", "qual é a minha prioridade?", "como estão os meus hábitos?"`;
        }

        // resumo do dia
        if (/\b(resumo|dia)\b/.test(q)) {
          const p = appState.tarefas.filter(t => t.status !== "concluida").length;
          const ev = getTodayEvents().length;
          const ph = getPendingHabits().length;
          const sc = getProductivityScore();
          const ov = getOverdueTasks().length;
          let msg = `Resumo do teu dia:\n• ${ev} compromisso${ev !== 1 ? "s" : ""} agendado${ev !== 1 ? "s" : ""}\n• ${p} tarefa${p !== 1 ? "s" : ""} em aberto\n• ${ph} hábito${ph !== 1 ? "s" : ""} por completar\n• Produtividade: ${sc}%`;
          if (ov) msg += `\n• ${ov} tarefa${ov !== 1 ? "s" : ""} atrasada${ov !== 1 ? "s" : ""}`;
          return msg;
        }

        // tarefas pendentes
        if (/tarefa|o que tenho|pendente/.test(q)) {
          const pendentes = appState.tarefas.filter(t => t.status !== "concluida");
          if (!pendentes.length) return "Parabéns! Não tens tarefas pendentes. Estás em dia com tudo!";
          const list = pendentes.slice(0, 5).map(t => `• ${t.titulo} (${t.prioridade})`).join("\n");
          return `Tens ${pendentes.length} tarefa${pendentes.length !== 1 ? "s" : ""} em aberto:\n${list}${pendentes.length > 5 ? `\n…e mais ${pendentes.length - 5}.` : ""}`;
        }

        // prioridade
        if (/prioridade|importante|urgente/.test(q)) {
          const alta = appState.tarefas.filter(t => t.status !== "concluida" && t.prioridade === "alta");
          if (!alta.length) return "Não tens tarefas de alta prioridade em aberto. Bom trabalho!";
          const top = alta.sort((a, b) => new Date(a.prazo) - new Date(b.prazo))[0];
          return `A tua prioridade mais urgente é "${top.titulo}" — prazo: ${new Date(top.prazo).toLocaleString("pt-PT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}.\nTens ${alta.length} tarefa${alta.length !== 1 ? "s" : ""} de alta prioridade no total.`;
        }

        // hábitos / streak
        if (/h[aá]bito|streak/.test(q)) {
          const ph = getPendingHabits();
          const dh = getCompletedHabitsToday();
          const best = Math.max(...appState.habitos.map(h => h.streak), 0);
          let resp = `Hábitos: ${dh.length} concluído${dh.length !== 1 ? "s" : ""} hoje, ${ph.length} por completar.`;
          if (ph.length) resp += `\nPendentes: ${ph.map(h => h.nome).join(", ")}.`;
          resp += `\nMelhor streak actual: ${best} dias.`;
          return resp;
        }

        // agenda / eventos
        if (/agenda|compromisso|evento/.test(q)) {
          const ev = getTodayEvents();
          if (!ev.length) return "Não tens compromissos agendados para hoje.";
          const list = ev.map(e => `• ${e.horario} — ${e.titulo}`).join("\n");
          return `Tens ${ev.length} compromisso${ev.length !== 1 ? "s" : ""} hoje:\n${list}`;
        }

        // produtividade / progresso
        if (/produtividade|progresso/.test(q)) {
          const sc = getProductivityScore();
          const done = getCompletedTasks().length;
          const total = appState.tarefas.length;
          const msg2 = sc >= 70 ? "Excelente ritmo!" : sc >= 40 ? "Estás no bom caminho, continua!" : "Ainda há espaço para evoluir hoje.";
          return `A tua produtividade está em ${sc}%. Concluíste ${done} de ${total} tarefas. ${msg2}`;
        }

        // atrasadas
        if (/atrasad|atraso/.test(q)) {
          const ov = getOverdueTasks();
          if (!ov.length) return "Óptimas notícias! Não tens tarefas atrasadas.";
          const list = ov.map(t => `• ${t.titulo}`).join("\n");
          return `Tens ${ov.length} tarefa${ov.length !== 1 ? "s" : ""} atrasada${ov.length !== 1 ? "s" : ""}:\n${list}\nRecomendo tratar destas antes de começar algo novo.`;
        }

        // sugestão / conselho / dica
        if (/sugest[aã]o|conselho|dica/.test(q)) {
          const ov = getOverdueTasks().length;
          const ph = getPendingHabits();
          const alta = appState.tarefas.filter(t => t.status !== "concluida" && t.prioridade === "alta");
          if (ov) return `Dica: Tens ${ov} tarefa${ov !== 1 ? "s" : ""} atrasada${ov !== 1 ? "s" : ""}. Dedica os próximos 30 minutos a fechar essas pendências antes de iniciares algo novo.`;
          if (alta.length) return `Dica: Começa pelo mais difícil primeiro. A tua tarefa de maior prioridade é "${alta[0].titulo}". Bloqueia 90 minutos sem interrupções para a concluir.`;
          if (ph.length) return `Dica: Aproveita um momento tranquilo para completar rapidamente "${ph[0].nome}" — vai reforçar o teu streak de ${ph[0].streak} dias.`;
          return "Dica: Estás bem encaminhado hoje! Aproveita para planear amanhã antes das 22h — vai reduzir a carga cognitiva matinal.";
        }

        // resposta genérica
        return "Posso ajudar-te com tarefas, hábitos, agenda e produtividade. Experimenta perguntar sobre o teu dia, as tuas prioridades ou o estado dos teus hábitos!";
      },

      handleSend() {
        const inp = document.getElementById("chat-input");
        if (!inp) return;
        const text = inp.value.trim();
        if (!text) return;
        this._appendMsg(text, "user");
        inp.value = "";
        this._showTyping();
        const delay = 520 + Math.floor(Math.random() * 280);
        setTimeout(() => {
          this._hideTyping();
          this._appendMsg(this._getResponse(text), "ai");
        }, delay);
      }
    };

    document.getElementById("kairo-chat-btn").addEventListener("click", () => kairoChat.toggle());
    document.getElementById("kairo-chat-close").addEventListener("click", () => kairoChat.close());
    document.getElementById("chat-send-btn").addEventListener("click", () => kairoChat.handleSend());
    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") kairoChat.handleSend();
    });
    // ---- End Kairo AI Chat ----
  </script>
</body>
</html>
